<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Gestion@</title>
    
    <!-- CSS GLOBAL -->
    <link rel="stylesheet" th:href="@{/css/estilos-globales.css}">
    
    <!-- CSS ESPECÍFICO DEL LOGIN -->
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
    <!-- Barra de navegación -->
    <nav>
        <div class="logo">Gestion@</div>
        <div class="nav-buttons">
            <a th:href="@{/web/registro}" class="btn-nav">Registrarse</a>
            <a th:href="@{/web/login}" class="btn-nav">Iniciar sesión</a>
        </div>
    </nav>

    <!-- Formulario de login -->
    <div class="login-container">
        <div class="login-box">
            <h1>Inicia sesión</h1>
            
            <!-- Mensaje de error si el login falla -->
            <div th:if="${error}" class="alert alert-error">
                <span th:text="${error}">Usuario o contraseña incorrectos</span>
            </div>
            
            <!-- Formulario con Thymeleaf -->
            <form th:action="@{/web/login}" method="post">
                <div class="form-group">
                    <input type="email" 
                           id="email" 
                           name="email" 
                           placeholder="Email" 
                           required 
                           autocomplete="email">
                </div>
                
                <div class="form-group">
                    <input type="password" 
                           id="contrasenya" 
                           name="contrasenya" 
                           placeholder="Contraseña" 
                           required 
                           autocomplete="current-password">
                </div>
                
                <button type="submit" class="btn btn-primary btn-block">
                    Iniciar sesión
                </button>
            </form>
            
            <p class="info-text">
                Si no tienes usuario y contraseña, contacta al<br>
                centro para que te proporcione las claves.
            </p>
        </div>
    </div>
</body>
</html>
