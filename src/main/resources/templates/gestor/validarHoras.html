<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validar Horas | Gestion@</title>
    <link rel="stylesheet" th:href="@{/css/estilos-globales.css}">
    <link rel="stylesheet" th:href="@{/css/gestor.css}">
    <style>
        .container-validar {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        .page-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 32px;
        }
        .btn-volver {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #e74c3c;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: gap 0.2s;
        }
        .btn-volver:hover { gap: 10px; }
        .page-title { font-size: 26px; font-weight: 700; color: #333; margin: 0; }

        .registro-card {
            background: white;
            border-radius: 16px;
            padding: 20px 24px;
            margin-bottom: 14px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .registro-info { flex: 1; min-width: 200px; }
        .registro-alumno { font-size: 16px; font-weight: 700; color: #333; }
        .registro-empresa { font-size: 13px; color: #888; margin-top: 2px; }
        .registro-detalle {
            display: flex;
            gap: 24px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .detalle-item { display: flex; flex-direction: column; }
        .detalle-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; color: #aaa; font-weight: 700; }
        .detalle-valor { font-size: 14px; font-weight: 600; color: #333; }
        .detalle-valor.horas { font-size: 20px; color: #e74c3c; }

        .acciones { display: flex; gap: 10px; }
        .btn-validar {
            padding: 10px 20px;
            background: linear-gradient(135deg, #2ecc71, #58d68d);
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-validar:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(46,204,113,0.4); }
        .btn-rechazar {
            padding: 10px 20px;
            background: #fdf0f0;
            color: #c0392b;
            border: none;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-rechazar:hover { background: #e74c3c; color: white; }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #aaa;
            background: white;
            border-radius: 20px;
        }
        .empty-state p { font-size: 16px; margin-top: 16px; }
    </style>
</head>
<body>
<nav class="navbar-gestor">
    <img th:src="@{/img/logo.png}" alt="Gestion@" class="logo-img">
    <div class="nav-menu">
        <a href="#" class="nav-link">Consulta alumnos</a>
        <a href="#" class="nav-link">Gestionar documentación</a>
        <a th:href="@{/web/gestor/validarHoras}" class="nav-link active">Validar horas</a>
        <a th:href="@{/web/logout}" class="btn-logout">Cerrar sesión</a>
    </div>
</nav>

<div class="container-validar">
    <div class="page-header">
        <a th:href="@{/web/inicioGestor}" class="btn-volver">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
            Volver
        </a>
        <h1 class="page-title">Horas pendientes de validación</h1>
    </div>

    <div th:if="${mensajeExito}" class="alert alert-success" th:text="${mensajeExito}" style="margin-bottom:20px;"></div>
    <div th:if="${mensajeError}" class="alert alert-error" th:text="${mensajeError}" style="margin-bottom:20px;"></div>

    <div th:if="${#lists.isEmpty(pendientes)}" class="empty-state">
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#ddd" stroke-width="1.5">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
        <p>No hay horas pendientes de validación.</p>
    </div>

    <div th:each="registro : ${pendientes}" class="registro-card">
        <div class="registro-info">
            <div class="registro-alumno"
                 th:text="${registro.practica.alumno.nombre + ' ' + registro.practica.alumno.apellidos}"></div>
            <div class="registro-empresa" th:text="${registro.practica.empresa.nombre}"></div>
            <div class="registro-detalle">
                <div class="detalle-item">
                    <span class="detalle-label">Fecha</span>
                    <span class="detalle-valor" th:text="${registro.fecha}"></span>
                </div>
                <div class="detalle-item">
                    <span class="detalle-label">Horario</span>
                    <span class="detalle-valor"
                          th:text="${registro.horaInicio + ' - ' + registro.horaFin}"></span>
                </div>
                <div class="detalle-item">
                    <span class="detalle-label">Horas</span>
                    <span class="detalle-valor horas" th:text="${registro.horas} + 'h'"></span>
                </div>
            </div>
        </div>
        <div class="acciones">
            <form th:action="@{/web/horas/validar/{id}(id=${registro.idRegistro})}" method="post">
                <input type="hidden" name="origen" value="gestor">
                <button type="submit" class="btn-validar">✓ Validar</button>
            </form>
            <form th:action="@{/web/horas/rechazar/{id}(id=${registro.idRegistro})}" method="post">
                <input type="hidden" name="origen" value="gestor">
                <button type="submit" class="btn-rechazar"
                        onclick="return confirm('¿Seguro que quieres rechazar estas horas?')">
                    ✕ Rechazar
                </button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
