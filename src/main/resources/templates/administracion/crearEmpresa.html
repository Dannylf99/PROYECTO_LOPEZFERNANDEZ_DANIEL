<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Empresa | Gestion@</title>

    <link rel="stylesheet" th:href="@{/css/estilos-globales.css}">
    <link rel="stylesheet" th:href="@{/css/administracion.css}">
    <link rel="stylesheet" th:href="@{/css/gestion-usuarios.css}">
</head>
<body>

<nav class="navbar-administracion">
    <img th:src="@{/img/logo.png}" alt="Gestion@" class="logo-img">
    <div class="nav-menu">
        <a th:href="@{/admin/usuarios}" class="nav-link">Usuarios</a>
        <a th:href="@{/admin/practicas}" class="nav-link">Prácticas</a>
        <a th:href="@{/admin/empresas}" class="nav-link active">Empresas</a>
        <a href="#" class="nav-link">Documentación</a>
        <a th:href="@{/web/informes/seleccion}" class="nav-link">Informes</a>
        <a th:href="@{/web/logout}" class="btn-logout">Cerrar sesión</a>
    </div>
</nav>

<div class="container-administracion">

    <div class="page-header">
        <div>
            <a th:href="@{/admin/empresas}" class="btn-volver">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
                Volver al listado
            </a>
            <h1 class="page-title" style="margin-top: 10px;">Nueva Empresa</h1>
            <p class="page-subtitle">Registra una nueva empresa en el sistema</p>
        </div>
    </div>

    <div th:if="${mensajeError}" class="alert alert-error" th:text="${mensajeError}"></div>

    <div class="form-card">
        <form th:action="@{/admin/empresas/crear}" method="post">

            <div class="form-group">
                <label class="form-label">Nombre *</label>
                <input type="text" class="form-input" name="nombre" placeholder="Nombre de la empresa" required>
            </div>

            <div class="form-group">
                <label class="form-label">CIF *</label>
                <input type="text" class="form-input" name="cif" placeholder="B12345678"
                       pattern="^[A-Z][0-9]{8}$"
                       title="Formato válido: letra + 8 números (ej: B12345678)" required>
                <small style="color: #666;">Formato: 1 letra mayúscula + 8 números (ej: B12345678)</small>
            </div>

            <div class="form-group">
                <label class="form-label">Dirección *</label>
                <input type="text" class="form-input" name="direccion" placeholder="Calle, número, ciudad" required>
            </div>

            <div class="form-actions">
                <a th:href="@{/admin/empresas}" class="btn-cancelar">Cancelar</a>
                <button type="submit" class="btn-crear">Crear empresa</button>
            </div>

        </form>
    </div>

</div>
</body>
</html>
