<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Usuario | Gestion@</title>

    <link rel="stylesheet" th:href="@{/css/estilos-globales.css}">
    <link rel="stylesheet" th:href="@{/css/administracion.css}">
    <link rel="stylesheet" th:href="@{/css/gestion-usuarios.css}">
</head>
<body>

<nav class="navbar-administracion">
    <div class="logo">Gestion@</div>
    <div class="nav-menu">
        <a th:href="@{/admin/usuarios}" class="nav-link active">Usuarios</a>
        <a href="#" class="nav-link">Documentación</a>
        <a href="#" class="nav-link">Informes</a>
        <a href="#" class="nav-link">Alumnos</a>
        <a th:href="@{/web/logout}" class="btn-logout">Cerrar sesión</a>
    </div>
</nav>

<div class="container-administracion">

    <!-- Cabecera -->
    <div class="page-header">
        <div>
            <a th:href="@{/admin/usuarios}" class="btn-volver">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
                Volver a la lista
            </a>
            <h1 class="page-title" style="margin-top: 10px;">Nuevo Usuario</h1>
            <p class="page-subtitle">Completa los datos para registrar un nuevo usuario</p>
        </div>
    </div>

    <!-- Alerta de error -->
    <div th:if="${mensajeError}" class="alert alert-error" th:text="${mensajeError}"></div>

    <!-- Formulario -->
    <div class="form-card">
        <form th:action="@{/admin/usuarios/crear}" method="post">

            <!-- Selector de rol -->
            <div class="form-group">
                <label class="form-label">Tipo de usuario *</label>
                <select class="form-select" name="tipo" id="selectTipo" onchange="cambiarCampos()" required>
                    <option value="">-- Selecciona un rol --</option>
                    <option value="ALUMNO">Alumno</option>
                    <option value="COORDINADOR">Coordinador</option>
                    <option value="GESTOR">Gestor</option>
                    <option value="ADMINISTRACION">Administración</option>
                </select>
            </div>

            <!-- Campos comunes -->
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Nombre *</label>
                    <input type="text" class="form-input" name="nombre" placeholder="Nombre" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Apellidos *</label>
                    <input type="text" class="form-input" name="apellidos" placeholder="Apellidos" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Email *</label>
                    <input type="email" class="form-input" name="email" placeholder="email@ejemplo.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Contraseña *</label>
                    <input type="password" class="form-input" name="contrasenya" placeholder="Contraseña" required>
                </div>
            </div>

            <!-- Campo específico: ALUMNO -->
            <div id="campos-alumno" class="campos-rol" style="display:none">
                <div class="form-group">
                    <label class="form-label">Empresa asignada</label>
                    <select class="form-select" name="empresaAsignada">
                        <option value="">-- Sin empresa --</option>
                        <option th:each="empresa : ${empresas}"
                                th:value="${empresa.idEmpresa}"
                                th:text="${empresa.nombre}">
                        </option>
                    </select>
                </div>
            </div>

            <!-- Campo específico: GESTOR -->
            <div id="campos-gestor" class="campos-rol" style="display:none">
                <div class="form-group">
                    <label class="form-label">Empresa</label>
                    <select class="form-select" name="idEmpresa">
                        <option value="">-- Sin empresa --</option>
                        <option th:each="empresa : ${empresas}"
                                th:value="${empresa.idEmpresa}"
                                th:text="${empresa.nombre}">
                        </option>
                    </select>
                </div>
            </div>

            <!-- Botones -->
            <div class="form-actions">
                <a th:href="@{/admin/usuarios}" class="btn-cancelar">Cancelar</a>
                <button type="submit" class="btn-crear">Crear usuario</button>
            </div>

        </form>
    </div>

</div>

<script>
    function cambiarCampos() {
        const tipo = document.getElementById('selectTipo').value;
        document.querySelectorAll('.campos-rol').forEach(el => el.style.display = 'none');
        if (tipo === 'ALUMNO') document.getElementById('campos-alumno').style.display = 'block';
        if (tipo === 'GESTOR') document.getElementById('campos-gestor').style.display = 'block';
    }
</script>

</body>
</html>
