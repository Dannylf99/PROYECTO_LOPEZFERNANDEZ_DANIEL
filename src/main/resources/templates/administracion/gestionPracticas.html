<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Prácticas | Gestion@</title>
    <link rel="stylesheet" th:href="@{/css/estilos-globales.css}">
    <link rel="stylesheet" th:href="@{/css/administracion.css}">
    <link rel="stylesheet" th:href="@{/css/gestion-usuarios.css}">
    <style>
        .search-bar { display: flex; gap: 10px; margin-bottom: 16px; align-items: center; }
        .search-bar input[type="text"] { flex: 2; min-width: 250px; padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; outline: none; transition: border-color 0.2s; }
        .search-bar input[type="text"]:focus { border-color: #666; }
        .search-bar select { flex: 1; min-width: 160px; padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; outline: none; }
        .search-bar button { padding: 8px 18px; border: none; border-radius: 6px; background-color: #333; color: #fff; font-size: 14px; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
        .search-bar button:hover { background-color: #555; }
        th.sortable { cursor: pointer; user-select: none; white-space: nowrap; }
        th.sortable:hover { background-color: rgba(0,0,0,0.05); }
        th.sortable .sort-icon::after { content: ' ⇅'; opacity: 0.4; font-size: 11px; }
        th.sortable.asc .sort-icon::after { content: ' ▲'; opacity: 1; font-size: 11px; }
        th.sortable.desc .sort-icon::after { content: ' ▼'; opacity: 1; font-size: 11px; }
        .empty-table { text-align: center; color: #888; padding: 24px; }
        .badge-preparada  { background: #fff4ec; color: #e67329; }
        .badge-activa     { background: #e8f8f0; color: #229954; }
        .badge-parada     { background: #fff3cd; color: #856404; }
        .badge-finalizada { background: #eaf4fc; color: #1a6fa8; }
        .progress-bar-wrapper { display: flex; align-items: center; gap: 8px; min-width: 120px; }
        .progress-bar { flex: 1; height: 8px; background: #e8e8e8; border-radius: 4px; overflow: hidden; }
        .progress-bar-fill { height: 100%; border-radius: 4px; background: linear-gradient(135deg, #3498db, #5dade2); }
        .progress-text { font-size: 12px; color: #666; white-space: nowrap; }
        .btn-parar    { background: #fff3cd; color: #856404; }
        .btn-parar:hover { background: #ffc107; color: white; }
        .btn-reanudar { background: #e8f8f0; color: #229954; }
        .btn-reanudar:hover { background: #2ecc71; color: white; }
        .btn-cancelar-p { background: #fdf0f0; color: #c0392b; }
        .btn-cancelar-p:hover { background: #e74c3c; color: white; }
        .btn-cancelar-p {background: #fdf0f0;  color: #c0392b; white-space: nowrap;      /* ← evita que se corte */ min-width: 90px;          }
        .btn-cancelar-p:hover { background: #e74c3c; color: white; }
        .actions-cell {white-space: nowrap;      /* ← evita que la celda comprima los botones */
        }
    </style>
</head>
<body>
<nav class="navbar-administracion">
    <img th:src="@{/img/logo.png}" alt="Gestion@" class="logo-img">
    <div class="nav-menu">
        <a th:href="@{/admin/usuarios}" class="nav-link">Usuarios</a>
        <a th:href="@{/admin/practicas}" class="nav-link active">Prácticas</a>
        <a th:href="@{/admin/empresas}" class="nav-link">Empresas</a>
        <a href="#" class="nav-link">Documentación</a>
        <a href="#" class="nav-link">Informes</a>
        <a th:href="@{/web/logout}" class="btn-logout">Cerrar sesión</a>
    </div>
</nav>
<div class="container-administracion">
    <div class="page-header">
        <div>
            <a th:href="@{/web/inicioAdministracion}" class="btn-volver">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
                Volver al inicio
            </a>
            <h1 class="page-title" style="margin-top:10px;">Gestión de Prácticas</h1>
            <p class="page-subtitle">Lista de todas las prácticas activas en el sistema</p>
        </div>
        <a th:href="@{/admin/practicas/nueva}" class="btn-nuevo-usuario">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            Nueva práctica
        </a>
    </div>

    <div th:if="${mensajeExito}" class="alert alert-success" th:text="${mensajeExito}"></div>
    <div th:if="${mensajeError}" class="alert alert-error" th:text="${mensajeError}"></div>

    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Buscar..." onkeydown="if(event.key==='Enter') filtrarTabla()">
        <select id="searchField">
            <option value="all">Todos los campos</option>
            <option value="0">Alumno</option>
            <option value="1">DNI</option>
            <option value="2">Coordinador</option>
            <option value="3">Empresa</option>
            <option value="4">Fecha inicio</option>
            <option value="5">Fecha fin</option>
            <option value="8">Estado</option>
        </select>
        <button onclick="filtrarTabla()">Buscar</button>
    </div>
    <p id="contadorResultados" style="margin-top:-8px; margin-bottom:10px; font-size:13px; color:#888;"></p>

    <div class="table-wrapper">
        <table class="users-table" id="practicasTable">
            <thead>
            <tr>
                <th class="sortable" onclick="ordenarTabla(0)">Alumno<span class="sort-icon"></span></th>
                <th class="sortable" onclick="ordenarTabla(1)">DNI<span class="sort-icon"></span></th>
                <th class="sortable" onclick="ordenarTabla(2)">Coordinador<span class="sort-icon"></span></th>
                <th class="sortable" onclick="ordenarTabla(3)">Empresa<span class="sort-icon"></span></th>
                <th class="sortable" onclick="ordenarTabla(4)">Fecha inicio<span class="sort-icon"></span></th>
                <th class="sortable" onclick="ordenarTabla(5)">Fecha fin<span class="sort-icon"></span></th>
                <th class="sortable" onclick="ordenarTabla(6)">Horas tot.<span class="sort-icon"></span></th>
                <th>Progreso</th>
                <th class="sortable" onclick="ordenarTabla(8)">Estado<span class="sort-icon"></span></th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody id="practicasBody">
            <tr th:each="practica : ${practicas}">
                <td th:text="${practica.alumno.nombre + ' ' + practica.alumno.apellidos}"></td>
                <td th:text="${practica.alumno.dni}"></td>
                <td th:text="${practica.coordinador.nombre + ' ' + practica.coordinador.apellidos}"></td>
                <td th:text="${practica.empresa.nombre}"></td>
                <td th:text="${practica.fechaInicio}"></td>
                <td th:text="${practica.fechaFin}"></td>
                <td th:text="${practica.horasTotales}"></td>
                <td>
                    <div class="progress-bar-wrapper">
                        <div class="progress-bar">
                            <div class="progress-bar-fill"
                                 th:style="'width:' + (${practica.horasTotales > 0} ? ${practica.horasHechas * 100 / practica.horasTotales} : 0) + '%'"></div>
                        </div>
                        <span class="progress-text" th:text="${practica.horasHechas} + '/' + ${practica.horasTotales}"></span>
                    </div>
                </td>
                <td>
                    <span class="badge"
                          th:classappend="'badge-' + ${#strings.toLowerCase(practica.estado.name())}"
                          th:text="${practica.estado}"></span>
                </td>
                <td class="actions-cell">
                    <a th:href="@{/admin/practicas/editar/{id}(id=${practica.idPractica})}" class="btn-action btn-edit">Editar</a>

                    <!-- Parar (solo si ACTIVA) -->
                    <form th:if="${practica.estado.name() == 'ACTIVA'}"
                          th:action="@{/admin/practicas/parar/{id}(id=${practica.idPractica})}" method="post" style="display:inline;">
                        <button type="submit" class="btn-action btn-parar"
                                onclick="return confirm('¿Pausar esta práctica?')">⏸ Pausar</button>
                    </form>

                    <!-- Reanudar (solo si PARADA) -->
                    <form th:if="${practica.estado.name() == 'PARADA'}"
                          th:action="@{/admin/practicas/reanudar/{id}(id=${practica.idPractica})}" method="post" style="display:inline;">
                        <button type="submit" class="btn-action btn-reanudar">▶ Reanudar</button>
                    </form>

                    <!-- Cancelar (si ACTIVA o PARADA) -->
                    <form th:if="${practica.estado.name() == 'ACTIVA' or practica.estado.name() == 'PARADA'}"
                          th:action="@{/admin/practicas/cancelar/{id}(id=${practica.idPractica})}" method="post" style="display:inline;">
                        <button type="submit" class="btn-action btn-cancelar-p"
                                onclick="return confirm('¿Cancelar esta práctica? Esta acción no se puede deshacer.')">✕ Cancelar</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(practicas)}">
                <td colspan="10" class="empty-table">No hay prácticas registradas</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<script>
    let sortCol = -1, sortAsc = true;
    function filtrarTabla() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        const campo = document.getElementById('searchField').value;
        const filas = Array.from(document.querySelectorAll('#practicasBody tr'));
        let visibles = 0;
        filas.forEach(fila => {
            const celdas = fila.querySelectorAll('td');
            if (celdas.length <= 1) { fila.style.display = ''; return; }
            let texto = campo === 'all' ? Array.from(celdas).map(c => c.innerText).join(' ').toLowerCase() : (celdas[parseInt(campo)]?.innerText || '').toLowerCase();
            const visible = texto.includes(query);
            fila.style.display = visible ? '' : 'none';
            if (visible) visibles++;
        });
        const total = filas.filter(f => f.querySelectorAll('td').length > 1).length;
        document.getElementById('contadorResultados').textContent = query ? `Mostrando ${visibles} de ${total} prácticas` : '';
    }
    function ordenarTabla(col) {
        document.querySelectorAll('th.sortable').forEach(h => h.classList.remove('asc','desc'));
        if (sortCol === col) { sortAsc = !sortAsc; } else { sortCol = col; sortAsc = true; }
        document.querySelectorAll('th.sortable')[col].classList.add(sortAsc ? 'asc' : 'desc');
        const tbody = document.getElementById('practicasBody');
        const filas = Array.from(tbody.querySelectorAll('tr')).filter(f => f.querySelectorAll('td').length > 1);
        filas.sort((a,b) => {
            const ca = a.querySelectorAll('td')[col]?.innerText.trim() || '';
            const cb = b.querySelectorAll('td')[col]?.innerText.trim() || '';
            if (col === 6) return sortAsc ? parseInt(ca)-parseInt(cb) : parseInt(cb)-parseInt(ca);
            return sortAsc ? ca.localeCompare(cb,'es') : cb.localeCompare(ca,'es');
        });
        filas.forEach(f => tbody.appendChild(f));
    }
</script>
</body>
</html>
