<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Práctica | Gestion@</title>
    <link rel="stylesheet" th:href="@{/css/estilos-globales.css}">
    <link rel="stylesheet" th:href="@{/css/administracion.css}">
    <link rel="stylesheet" th:href="@{/css/gestion-usuarios.css}">
</head>
<body>
<nav class="navbar-administracion">
    <img th:src="@{/img/logo.png}" alt="Gestion@" class="logo-img">
    <div class="nav-menu">
        <a th:href="@{/web/inicioAdministracion}" class="nav-link">Inicio</a>
        <a th:href="@{/admin/usuarios}"           class="nav-link">Usuarios</a>
        <a th:href="@{/admin/practicas}"          class="nav-link">Prácticas</a>
        <a th:href="@{/admin/empresas}"           class="nav-link">Empresas</a>

        <div class="nav-dropdown">
            <span class="nav-link nav-dropdown-toggle">Documentación ▾</span>
            <div class="nav-dropdown-menu">
                <div class="nav-dropdown-menu-inner">
                    <a th:href="@{/web/documentos/admin/listado}" class="nav-dropdown-item">Gestión</a>
                    <a th:href="@{/web/documentos/admin}"         class="nav-dropdown-item">Validación</a>
                </div>
            </div>
        </div>

        <a th:href="@{/web/informes/seleccion}" class="nav-link">Informes</a>
        <a th:href="@{/web/logout}"             class="btn-logout">Cerrar sesión</a>
    </div>
</nav>
<div class="container-administracion">
    <div class="page-header">
        <div>
            <a th:href="@{/admin/practicas}" class="btn-volver">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
                Volver al listado
            </a>
            <h1 class="page-title" style="margin-top: 10px;">Nueva Práctica</h1>
            <p class="page-subtitle">Crea una nueva práctica asignando alumno, coordinador y empresa</p>
        </div>
    </div>
    <div th:if="${mensajeError}" class="alert alert-error" th:text="${mensajeError}"></div>
    <div class="form-card">
        <form th:action="@{/admin/practicas/crear}" method="post">
            <div class="form-group">
                <label class="form-label">Alumno *</label>
                <select class="form-select" name="idAlumno" required>
                    <option value="">-- Selecciona un alumno --</option>
                    <option th:each="alumno : ${alumnos}" th:value="${alumno.idUsuario}" th:text="${alumno.nombre + ' ' + alumno.apellidos + ' (' + alumno.dni + ')'}"></option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Coordinador *</label>
                <select class="form-select" name="idCoordinador" required>
                    <option value="">-- Selecciona un coordinador --</option>
                    <option th:each="coordinador : ${coordinadores}" th:value="${coordinador.idUsuario}" th:text="${coordinador.nombre + ' ' + coordinador.apellidos + ' (' + coordinador.dni + ')'}"></option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Empresa *</label>
                <select class="form-select" name="idEmpresa" required>
                    <option value="">-- Selecciona una empresa --</option>
                    <option th:each="empresa : ${empresas}" th:value="${empresa.idEmpresa}" th:text="${empresa.nombre + ' (' + empresa.cif + ')'}"></option>
                </select>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Fecha de inicio *</label>
                    <input type="date" class="form-input" name="fechaInicio" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Fecha de fin *</label>
                    <input type="date" class="form-input" name="fechaFin" required>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Horas totales *</label>
                <input type="number" class="form-input" name="horasTotales" min="1" max="9999" placeholder="Ej: 400" required>
            </div>
            <div class="form-group">
                <label class="form-label">Estado inicial</label>
                <input type="text" class="form-input" value="PREPARADA" readonly style="background: #f0f0f0; color: #888;">
                <small style="color: #888; font-size: 13px;">El estado inicial siempre es PREPARADA.</small>
            </div>
            <div class="form-actions">
                <a th:href="@{/admin/practicas}" class="btn-cancelar">Cancelar</a>
                <button type="submit" class="btn-crear">Crear práctica</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
