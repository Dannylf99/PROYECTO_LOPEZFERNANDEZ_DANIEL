<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Documentación | Gestion@</title>
    <link rel="stylesheet" th:href="@{/css/estilos-globales.css}">
    <link rel="stylesheet" th:href="@{/css/coordinador.css}">
    <link rel="stylesheet" th:href="@{/css/gestion-usuarios.css}">
    <link rel="stylesheet" th:href="@{/css/documentos.css}">
    <style>
        .users-table thead { background: linear-gradient(135deg, #2ecc71 0%, #58d68d 100%); }
        .btn-crear { background: linear-gradient(135deg, #2ecc71 0%, #58d68d 100%);
                     box-shadow: 0 4px 15px rgba(46,204,113,0.3); }
        .btn-crear:hover { background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%); }
    </style>
</head>
<body>
<nav class="navbar-coordinador">
    <img th:src="@{/img/logo.png}" alt="Gestion@" class="logo-img">
    <div class="nav-menu">
        <a th:href="@{/web/inicioCoordinador}"              class="nav-link">Inicio</a>
        <a th:href="@{/web/coordinador/alumnos}"            class="nav-link">Alumnado</a>
        <a th:href="@{/web/coordinador/validarHoras}"       class="nav-link">Validar horas</a>
        <a th:href="@{/web/documentos/coordinador/listado}" class="nav-link">Documentación</a>
        <a th:href="@{/web/informes/seleccion}"             class="nav-link">Informes</a>
        <a th:href="@{/web/logout}"                         class="btn-logout">Cerrar sesión</a>
    </div>
</nav>

<div class="container-coordinador">

    <div class="page-header">
        <div>
            <a th:href="@{/web/inicioCoordinador}" class="btn-volver"
               style="color:var(--color-coordinador-primario);">← Volver</a>
            <h1 class="page-title">Documentación de mis alumnos</h1>
            <p class="page-subtitle">Consulta y filtra los documentos de tus alumnos.</p>
        </div>
    </div>

    <!-- Filtros -->
    <div class="doc-card" style="margin-bottom:25px;">
        <h2 class="doc-section-title">Filtros</h2>
        <form th:action="@{/web/documentos/coordinador/listado}" method="get">
            <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); gap:1rem; margin-bottom:1rem;">

                <div class="doc-form-group">
                    <label class="filtro-label">Tipo</label>
                    <select name="tipo" class="doc-select">
                        <option value="">Todos</option>
                        <option value="CONVENIO"            th:selected="${tipoSeleccionado == 'CONVENIO'}">Convenio</option>
                        <option value="MEMORIA_FINAL"       th:selected="${tipoSeleccionado == 'MEMORIA_FINAL'}">Memoria final</option>
                        <option value="INFORME_SEGUIMIENTO" th:selected="${tipoSeleccionado == 'INFORME_SEGUIMIENTO'}">Informe de seguimiento</option>
                        <option value="EVALUACION"          th:selected="${tipoSeleccionado == 'EVALUACION'}">Evaluación</option>
                    </select>
                </div>

                <div class="doc-form-group">
                    <label class="filtro-label">Estado</label>
                    <select name="estado" class="doc-select">
                        <option value="">Todos</option>
                        <option value="PENDIENTE_FIRMA_GESTOR"      th:selected="${estadoSeleccionado == 'PENDIENTE_FIRMA_GESTOR'}">Pend. firma gestor</option>
                        <option value="PENDIENTE_FIRMA_COORDINADOR" th:selected="${estadoSeleccionado == 'PENDIENTE_FIRMA_COORDINADOR'}">Pend. firma coordinador</option>
                        <option value="PENDIENTE_FIRMA_ALUMNO"      th:selected="${estadoSeleccionado == 'PENDIENTE_FIRMA_ALUMNO'}">Pend. firma alumno</option>
                        <option value="PENDIENTE_VALIDACION"        th:selected="${estadoSeleccionado == 'PENDIENTE_VALIDACION'}">Pend. validación</option>
                        <option value="VALIDADO"                    th:selected="${estadoSeleccionado == 'VALIDADO'}">Validado</option>
                        <option value="RECHAZADO"                   th:selected="${estadoSeleccionado == 'RECHAZADO'}">Rechazado</option>
                    </select>
                </div>

                <div class="doc-form-group">
                    <label class="filtro-label">Alumno</label>
                    <select name="idAlumno" class="doc-select">
                        <option value="">Todos</option>
                        <option th:each="a : ${alumnos}"
                                th:value="${a.idUsuario}"
                                th:text="${a.apellidos + ', ' + a.nombre}"
                                th:selected="${alumnoSeleccionado == a.idUsuario.toString()}">
                        </option>
                    </select>
                </div>

            </div>
            <button type="submit" class="btn-crear">Filtrar</button>
            <a th:href="@{/web/documentos/coordinador/listado}" class="btn-cancelar"
               style="margin-left:8px;">Limpiar filtros</a>
        </form>
    </div>

    <!-- Tabla -->
    <div class="table-wrapper">
        <table class="users-table">
            <thead>
            <tr>
                <th>Alumno</th>
                <th>Empresa</th>
                <th>Tipo</th>
                <th>Fecha subida</th>
                <th>Estado</th>
                <th>Descargar</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(documentos)}">
                <td colspan="6" class="empty-table">No hay documentos con los filtros seleccionados.</td>
            </tr>
            <tr th:each="doc : ${documentos}">
                <td th:text="${doc.alumno.apellidos + ', ' + doc.alumno.nombre}"></td>
                <td th:text="${doc.practica != null ? doc.practica.empresa.nombre : '-'}"></td>
                <td th:text="${doc.tipo.name().replace('_',' ')}"></td>
                <td th:text="${#temporals.format(doc.fechaSubida,'dd/MM/yyyy HH:mm')}"></td>
                <td>
                        <span class="doc-badge"
                              th:classappend="${doc.estado.name()}"
                              th:text="${doc.estado.name().replace('_',' ')}">
                        </span>
                </td>
                <td>
                    <a th:href="@{/web/documentos/descargar/{id}(id=${doc.idDocumento})}"
                       class="btn-action">Descargar</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</div>
</body>
</html>
